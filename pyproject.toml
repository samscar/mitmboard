[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "mitmboard"
version = "0.2.0"
description = "Self-hosted network inspector for mobile HTTPS — a free, open alternative to Proxyman/Charles"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "NOTICE"]
authors = [{ name = "Abdulrahman Khalid" }]
maintainers = [{ name = "samscar" }]
requires-python = ">=3.12"
keywords = ["mitmproxy", "proxy", "https", "ios", "android", "network", "inspector", "debugging"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: Internet :: Proxy Servers",
    "Topic :: Software Development :: Debuggers",
]
dependencies = ["mitmproxy==12.3.1", "fastapi>=0.110", "uvicorn>=0.29", "pydantic>=2.6", "msgpack>=1.0", "ruamel.yaml>=0.18"]

[project.urls]
# This is a fork. The original project keeps the copyright; see NOTICE.
Homepage = "https://github.com/samscar/mitmboard"
Repository = "https://github.com/samscar/mitmboard"
Issues = "https://github.com/samscar/mitmboard/issues"
Upstream = "https://github.com/anthibo/proxino"

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "pytest-asyncio>=0.23"]
desktop = ["pyinstaller>=6.11"]

[project.scripts]
mitmboard = "mitmboard.cli:main"

[tool.setuptools]
packages = ["mitmboard"]
include-package-data = true

[tool.setuptools.package-data]
mitmboard = ["web_dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore:Using httpx with starlette.testclient is deprecated:DeprecationWarning",
]
